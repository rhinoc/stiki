name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    if: ${{ !contains(github.event.head_commit.message, 'chore') }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Bump version
        id: ver
        run: |
          NEW="$(scripts/update_version.sh)"
          echo "version=$NEW" >>"$GITHUB_OUTPUT"

      - name: Build release DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: scripts/build_release.sh

      - name: Upload GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/stiki-${{ steps.ver.outputs.version }}-*.dmg
          file_glob: true
          tag: app-v${{ steps.ver.outputs.version }}
          release_name: Stiki v${{ steps.ver.outputs.version }}
          overwrite: true
          body: |
            Open the DMG and drag stiki.app to Applications.

            If macOS blocks first launch, remove quarantine from the installed app:

            ```bash
            xattr -dr com.apple.quarantine /Applications/stiki.app
            ```

      - name: Upload updater artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          gh release upload "app-v${VERSION}" \
            "dist/latest.json" \
            "dist/stiki-${VERSION}-aarch64.app.tar.gz" \
            "dist/stiki-${VERSION}-aarch64.app.tar.gz.sig" \
            "dist/stiki-${VERSION}-x64.app.tar.gz" \
            "dist/stiki-${VERSION}-x64.app.tar.gz.sig" \
            --clobber

      - name: Commit version bump
        run: scripts/commit_release.sh
