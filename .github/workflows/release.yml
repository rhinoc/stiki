name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'chore') }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Bump version
        id: ver
        run: |
          NEW="$(scripts/update_version.sh)"
          echo "version=$NEW" >>"$GITHUB_OUTPUT"

      - name: Upload version files
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            VERSION
            package.json
            src-tauri/Cargo.toml
            src-tauri/Cargo.lock

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x64
            target: x86_64-apple-darwin
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.4"

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release DMG
        env:
          STIKI_RELEASE_ARCHS: ${{ matrix.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: scripts/build_release.sh

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/stiki-${{ needs.version.outputs.version }}-${{ matrix.arch }}.dmg
            dist/stiki-${{ needs.version.outputs.version }}-${{ matrix.arch }}.app.tar.gz
            dist/stiki-${{ needs.version.outputs.version }}-${{ matrix.arch }}.app.tar.gz.sig

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download version files
        uses: actions/download-artifact@v4
        with:
          name: version-files

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Write updater manifest
        env:
          VERSION: ${{ needs.version.outputs.version }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: scripts/write_latest_json.sh

      - name: Upload GitHub Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: dist/stiki-${{ needs.version.outputs.version }}-*.dmg
          file_glob: true
          tag: app-v${{ needs.version.outputs.version }}
          release_name: Stiki v${{ needs.version.outputs.version }}
          overwrite: true
          body: |
            Open the DMG and drag stiki.app to Applications.

            Apple Speech works without model files. To use SenseVoice, place a model directory or symlink in:

            `~/Library/Application Support/com.rhinoc.stiki/sensevoice-models/`

            If macOS blocks first launch, remove quarantine from the installed app:

            ```bash
            xattr -dr com.apple.quarantine /Applications/stiki.app
            ```

      - name: Upload updater artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          gh release upload "app-v${VERSION}" \
            "dist/latest.json" \
            "dist/stiki-${VERSION}-aarch64.app.tar.gz" \
            "dist/stiki-${VERSION}-aarch64.app.tar.gz.sig" \
            "dist/stiki-${VERSION}-x64.app.tar.gz" \
            "dist/stiki-${VERSION}-x64.app.tar.gz.sig" \
            --clobber

      - name: Commit version bump
        run: scripts/commit_release.sh
